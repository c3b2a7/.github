name: "CodeQL Go Analysis"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory for Go commands"
        required: false
        type: string
        default: "."
      entrypoint:
        description: "Entrypoint to build"
        required: true
        type: string
      runner-os:
        description: "Operating system for the runner"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  analyze:
    name: Go
    runs-on: ${{ inputs.runner-os }}
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v3.29.5
        with:
          languages: go
          build-mode: manual

      - name: Download dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          go mod download
          go mod verify

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          mkdir -p snapshot
          go build -o snapshot/${INPUTS_ENTRYPOINT} ${INPUTS_ENTRYPOINT}
        env:
          INPUTS_ENTRYPOINT: ${{ inputs.entrypoint }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v3.29.5
        with:
          category: "/language:go"